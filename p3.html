= if Text.Upper(Text.Trim(Text.From([Source]))) = "UAT" then
    Text.Combine(
        List.Transform(
            List.Distinct(
                List.RemoveNulls(
                    Table.Column(
                        Table.SelectRows(
                            [Rows],
                            each Text.Upper(Text.Trim(Text.From([source_environment]))) = "UAT"
                        ),
                        "run_id"
                    )
                )
            ),
            each Text.From(_)
        ),
        "#(lf)"
    )
else
    null
