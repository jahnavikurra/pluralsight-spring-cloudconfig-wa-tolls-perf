let currentTab='overview';let openOrg='NFC-ETS';function esc(x){return String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')};
function metric(name,value,icon,orange=false){return `<div class="metric"><div class="metric-icon ${orange?'orange':''}">${icon}</div><div><div class="metric-name">${name}</div><div class="metric-val">${value}</div></div></div>`};

function bars(items,max,colors=[''],withBadges=false){return `<div class="bars">${items.map((i,n)=>`<div class="bar-item">${withBadges?`<div class="aff-row"><span class="badge ${i[0]==='GH'?'gh':''}">${i[0]}</span><div class="aff-body"><div class="bar-head"><span class="name">${esc(i[1])}</span><strong>${i[2]}</strong></div><div class="bar-track"><div class="bar-fill ${i[0]==='GH'?'orange':''}" style="width:${Math.max(i[2]/max*100,1)}%"></div></div></div></div>`:`<div class="bar-head"><span class="name">${esc(i[0])}</span><strong>${i[1]}</strong></div><div class="bar-track"><div class="bar-fill ${colors[n%colors.length]||''}" style="width:${Math.max(i[1]/max*100,1)}%"></div></div>`}</div>`).join('')}</div>`};
